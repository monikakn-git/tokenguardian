steps:
  # Build the backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/token-guardian-backend', './token_guardian_backend']
    dir: '.'

  # Build the frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/token-guardian-frontend', './frontend']
    dir: '.'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/token-guardian-backend']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/token-guardian-frontend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'token-guardian-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/token-guardian-backend'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--set-env-vars'
      - 'DATABASE_URL=sqlite:///./sql_app.db,GEMINI_API_KEY=${_GEMINI_API_KEY}'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'token-guardian-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/token-guardian-frontend'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '5173'
      - '--set-env-vars'
      - 'VITE_API_URL=https://token-guardian-backend-uc.a.run.app/api'

options:
  substitution_option: 'ALLOW_LOOSE'

substitutions:
  _GEMINI_API_KEY: ''  # Set in build trigger